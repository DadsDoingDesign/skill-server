<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skill embed</title>
<style>
/* Neutral + transparent so the host tile's own background shows through the
   iframe. Only the accent is "brand", and it's overridable via ?accent=. */
:root{
  --ink:#1b1a17; --muted:rgba(20,18,14,.58); --faint:rgba(20,18,14,.16);
  --accent:#b34a2c; --hover:rgba(20,18,14,.06);
  --radius:8px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,monospace;
}
[data-theme="dark"]{
  --ink:#f1efe9; --muted:rgba(241,239,233,.62); --faint:rgba(241,239,233,.18);
  --accent:#d97a52; --hover:rgba(241,239,233,.09);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;line-height:1.5;}
#root{height:100%;}

.ic{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;font-family:inherit;
  font-size:.76rem;line-height:1;padding:.55em .72em;border-radius:var(--radius);cursor:pointer;
  border:1px solid var(--faint);background:transparent;color:var(--muted);
  transition:background .15s,color .15s,border-color .15s;white-space:nowrap;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn--accent{border-color:var(--accent);color:var(--accent);}
.btn--accent:hover{background:var(--accent);color:#fff;}
.btn--icon{padding:.5em;border-color:transparent;}
.btn--icon:hover{background:var(--hover);}
.btn .ic-check{display:none;}
.btn.copied .ic-copy{display:none;}
.btn.copied .ic-check{display:inline-block;}

.t-name{font-family:var(--mono);font-size:.9rem;font-weight:600;color:var(--ink);}
.t-desc{font-size:.82rem;color:var(--muted);}
.t-badge{display:inline-block;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);
  border-radius:99px;padding:.15em .55em;}
.clamp1,.clamp2,.clamp3{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;}
.clamp1{-webkit-line-clamp:1;} .clamp2{-webkit-line-clamp:2;} .clamp3{-webkit-line-clamp:3;}

/* Decorative document graphic (card only), themed to ink + accent. */
.w-bg{position:absolute;right:-6%;bottom:-12%;width:62%;max-width:170px;opacity:.18;
  pointer-events:none;z-index:0;}
.w-bg-stroke{stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none;}
.w-bg-accent{stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none;}

/* Card */
.w-card{position:relative;overflow:hidden;height:100%;padding:14px;display:flex;flex-direction:column;}
.w-card>*:not(.w-bg){position:relative;z-index:1;}
.w-card__head{display:flex;align-items:center;gap:8px;}
.w-card .t-desc{margin-top:7px;}
.w-card__actions{display:flex;gap:6px;margin-top:auto;padding-top:12px;}
.w-card__actions .btn{flex:1;}

/* Compact (column) */
.w-compact{height:100%;padding:11px 12px;display:flex;flex-direction:column;
  justify-content:space-between;gap:8px;overflow:hidden;}
.w-compact .t-name{font-size:.8rem;} .w-compact .t-desc{font-size:.72rem;margin-top:2px;}
.w-icons{display:flex;gap:2px;margin-left:-6px;}

/* Row */
.w-row{height:100%;padding:10px 12px;display:flex;align-items:center;gap:12px;overflow:hidden;}
.w-row__txt{min-width:0;flex:1;} .w-row__txt .t-name{font-size:.82rem;}
.w-row__txt .t-desc{font-size:.74rem;margin-top:2px;}
.w-row .w-icons{margin-left:0;flex:none;}

/* Micro (1x1) — one cute action + name */
.w-micro{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;padding:8px;text-align:center;overflow:hidden;}
.w-micro>*{position:relative;z-index:1;}
.w-micro__app{width:clamp(34px,42%,54px);aspect-ratio:1;border:none;border-radius:14px;cursor:pointer;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  transition:transform .12s,filter .12s;}
.w-micro__app:hover{transform:translateY(-1px);filter:brightness(1.07);}
.w-micro__app:active{transform:scale(.93);}
.w-micro__glyph{width:54%;height:54%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.w-micro__name{font-size:.72rem;max-width:100%;}

/* States */
.w-msg{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:14px;color:var(--muted);font-size:.8rem;}
.w-msg--err{color:#d9534f;}
.skel{height:100%;padding:14px;display:flex;flex-direction:column;gap:10px;}
.skel i{display:block;background:var(--faint);border-radius:4px;height:12px;animation:pulse 1.2s ease-in-out infinite;}
.skel i.w1{width:55%;height:14px;} .skel i.w2{width:90%;} .skel i.w3{width:70%;} .skel i.bar{margin-top:auto;height:30px;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

/* Toast */
.toasts{position:fixed;bottom:8px;left:8px;right:8px;z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;}
.toast{padding:.45rem .7rem;background:color-mix(in srgb,var(--ink) 88%,transparent);color:#fff;
  border-radius:var(--radius);font-size:.74rem;max-width:100%;animation:tin .18s ease-out;}
[data-theme="dark"] .toast{background:color-mix(in srgb,#000 70%,transparent);color:var(--ink);border:1px solid var(--faint);}
@keyframes tin{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="ic-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
  <symbol id="ic-open" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></symbol>
  <symbol id="ic-mcp" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></symbol>
</svg>

<div id="root"><div class="skel"><i class="w1"></i><i class="w2"></i><i class="w3"></i><i class="bar"></i></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const P = new URLSearchParams(location.search);
const server  = (P.get("server") || location.origin).replace(/\/+$/, "");
const skill   = (P.get("skill") || "").trim();
const variant = (P.get("variant") || "auto").toLowerCase();   // auto | card | compact | row
const theme   = (P.get("theme") || "auto").toLowerCase();     // light | dark | auto
const accent  = P.get("accent");
const badgeOv = P.get("badge");
const DEBUG = P.get("debug") === "1";                           // show a size/layout badge
const primary = ["copy", "open", "mcp"].includes((P.get("primary") || "").toLowerCase())
  ? P.get("primary").toLowerCase() : "copy";                    // core action for the 1x1 layout

function applyTheme(){
  let mode = theme;
  if (theme === "auto") mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = mode;
}
applyTheme();
if (theme === "auto" && matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
if (accent && /^#?[0-9a-fA-F]{3,8}$/.test(accent)) {
  document.documentElement.style.setProperty("--accent", accent[0] === "#" ? accent : "#" + accent);
}

const root = document.getElementById("root");
let DATA = null;            // { name, description, raw, category }
let currentLayout = null;   // last rendered layout, to avoid redundant re-renders

function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const ICONS = {
  copy: '<svg class="ic"><use href="#ic-copy"/></svg><svg class="ic ic-check"><use href="#ic-check"/></svg>',
  open: '<svg class="ic"><use href="#ic-open"/></svg>',
  mcp:  '<svg class="ic"><use href="#ic-mcp"/></svg>',
};
const DOC_BG = `<svg class="w-bg" viewBox="0 0 120 140" fill="none" aria-hidden="true">
  <path class="w-bg-stroke" d="M30 12 H76 L98 34 V122 a6 6 0 0 1 -6 6 H30 a6 6 0 0 1 -6 -6 V18 a6 6 0 0 1 6 -6 Z"/>
  <path class="w-bg-accent" d="M76 12 V34 H98"/>
  <path class="w-bg-stroke" d="M42 64 H80 M42 80 H80 M42 96 H68"/>
</svg>`;

const GLYPHS = {
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  open: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
  mcp:  '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>',
};
const PRIMARY_TITLE = { copy: "Copy skill", open: "Open skill", mcp: "Copy MCP command" };

function openUrl(){ return `${server}/#/skill/${encodeURIComponent(DATA?.name || skill)}`; }
function mcpCmd(){ return `claude mcp add --transport http skills ${server}/mcp`; }

function actionsFull(){
  return `
    <button class="btn" data-act="copy">${ICONS.copy}Copy</button>
    <a class="btn" data-act="open" target="_blank" rel="noopener" href="${esc(openUrl())}">${ICONS.open}Open</a>
    <button class="btn btn--accent" data-act="mcp">${ICONS.mcp}MCP</button>`;
}
function actionsIcons(){
  return `
    <button class="btn btn--icon" data-act="copy" title="Copy skill text">${ICONS.copy}</button>
    <a class="btn btn--icon" data-act="open" target="_blank" rel="noopener" href="${esc(openUrl())}" title="Open skill">${ICONS.open}</a>
    <button class="btn btn--icon" data-act="mcp" title="Copy MCP command" style="color:var(--accent)">${ICONS.mcp}</button>`;
}

// Pick a layout from the iframe's own pixel size (so resizing the Embed tile reflows).
function pickLayout(){
  if (variant !== "auto") return variant;
  const w = window.innerWidth || document.documentElement.clientWidth;
  const h = window.innerHeight || document.documentElement.clientHeight;
  if (w < 180 && h < 180) return "micro";    // ~1x1 — one cute action
  if (h < 170) return "row";                 // short & wide (2x1, 3x1)
  if (w < 200) return "compact";             // narrow & tall
  return "card";                             // 2x2+
}

function renderLayout(layout){
  const name = esc(DATA.name);
  const desc = esc(DATA.description || "");
  const cat  = esc(badgeOv != null ? badgeOv : (DATA.category || ""));
  const badge = cat ? `<span class="t-badge">${cat}</span>` : "";

  if (layout === "micro") {
    root.innerHTML = `
      <div class="w-micro">
        <button class="w-micro__app" data-act="${primary}" title="${PRIMARY_TITLE[primary]}">
          <svg class="w-micro__glyph" viewBox="0 0 24 24">${GLYPHS[primary]}</svg>
        </button>
        <div class="t-name clamp1 w-micro__name">${name}</div>
      </div>`;
  } else if (layout === "compact") {
    root.innerHTML = `
      <div class="w-compact">
        <div class="w-compact__txt">
          <div class="t-name clamp1">${name}</div>
          <div class="t-desc clamp2">${desc}</div>
        </div>
        <div class="w-icons">${actionsIcons()}</div>
      </div>`;
  } else if (layout === "row") {
    root.innerHTML = `
      <div class="w-row">
        <div class="w-row__txt">
          <div class="t-name clamp1">${name}</div>
          <div class="t-desc clamp2">${desc}</div>
        </div>
        <div class="w-icons">${actionsIcons()}</div>
      </div>`;
  } else {
    root.innerHTML = `
      <div class="w-card">
        ${DOC_BG}
        <div class="w-card__head"><span class="t-name clamp1">${name}</span>${badge}</div>
        <div class="t-desc clamp3">${desc}</div>
        <div class="w-card__actions">${actionsFull()}</div>
      </div>`;
  }
}

function showDebug(w, h, layout){
  let d = document.getElementById("dbg");
  if (!d) {
    d = document.createElement("div");
    d.id = "dbg";
    d.style.cssText = "position:fixed;top:2px;left:2px;z-index:99;font:10px/1.2 monospace;background:rgba(0,0,0,.7);color:#fff;padding:2px 5px;border-radius:3px;pointer-events:none";
    document.body.appendChild(d);
  }
  d.textContent = `${w}×${h} → ${layout}`;
}

function refresh(){
  if (!DATA) return;
  const w = window.innerWidth || document.documentElement.clientWidth;
  const h = window.innerHeight || document.documentElement.clientHeight;
  const layout = pickLayout();
  if (DEBUG) showDebug(w, h, layout);
  if (layout === currentLayout) return;
  currentLayout = layout;
  renderLayout(layout);
}

// Reflow when the iframe (Embed tile) is resized. Use several signals because
// hosts size embedded iframes in different ways.
if (window.ResizeObserver) {
  const ro = new ResizeObserver(() => refresh());
  ro.observe(document.documentElement);
  ro.observe(document.body);
}
window.addEventListener("resize", () => refresh());

function showMsg(text, isErr){ root.innerHTML = `<div class="w-msg${isErr ? " w-msg--err" : ""}">${esc(text)}</div>`; }

// ---- actions ----
function toast(msg, neg){
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast" + (neg ? " toast--neg" : "");
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}
async function copy(text){
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); }
    else {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
    }
    return true;
  } catch { return false; }
}
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-act]");
  if (!t || !DATA) return;
  const act = t.dataset.act;
  if (act === "open") {
    if (t.tagName === "A") return;            // anchor opens natively
    e.preventDefault();
    if (openUrl()) window.open(openUrl(), "_blank", "noopener");
    return;
  }
  e.preventDefault();
  if (act === "copy") {
    const ok = await copy(DATA.raw || "");
    toast(ok ? "Skill copied" : "Copy blocked — allow clipboard", !ok);
    if (ok) { t.classList.add("copied"); setTimeout(() => t.classList.remove("copied"), 1300); }
  } else if (act === "mcp") {
    const ok = await copy(mcpCmd());
    toast(ok ? "MCP command copied" : "Copy blocked — allow clipboard", !ok);
  }
});

// ---- load ----
(async () => {
  if (!skill) return showMsg("No skill specified. Add ?skill=<name> to the URL.", true);
  try {
    const res = await fetch(`${server}/api/skills/${encodeURIComponent(skill)}`, { headers: { Accept: "application/json" } });
    if (res.status === 404) return showMsg(`Skill “${skill}” not found.`, true);
    if (!res.ok) return showMsg(`Couldn’t load skill (${res.status}).`, true);
    const s = await res.json();
    DATA = {
      name: s.name || skill,
      description: s.description || s.metadata?.description || "",
      raw: s.raw || s.body || "",
      category: s.metadata?.category || "",
    };
    currentLayout = null;
    refresh();
    requestAnimationFrame(refresh);
  } catch {
    showMsg("Couldn’t reach the skill server.", true);
  }
})();
</script>
</body>
</html>

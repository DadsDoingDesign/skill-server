<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skill Server</title>
<link rel="stylesheet" href="/styles.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: ['class', '[data-theme="dark"]'],
    theme: {
      extend: {
        colors: {
          'surface-page':     'var(--surface-page)',
          'surface-raised':   'var(--surface-raised)',
          'surface-sunken':   'var(--surface-sunken)',
          'surface-edge':     'var(--surface-edge)',
          'ink-primary':      'var(--ink-primary)',
          'ink-secondary':    'var(--ink-secondary)',
          'ink-muted':        'var(--ink-muted)',
          'ink-inverse':      'var(--ink-inverse)',
          'accent-mark':      'var(--accent-mark)',
          'accent-link':      'var(--accent-link)',
          'feedback-positive':'var(--feedback-positive)',
          'feedback-negative':'var(--feedback-negative)',
          'feedback-pending': 'var(--feedback-pending)',
        },
        fontFamily: {
          display: ['var(--font-display)'],
          body:    ['var(--font-body)'],
          mono:    ['var(--font-mono)'],
        },
        boxShadow: {
          sheet: 'var(--shadow-sheet)',
          stack: 'var(--shadow-stack)',
        },
        borderRadius: {
          edge: 'var(--radius-edge)',
        },
        maxWidth: {
          measure: 'var(--measure-text)',
        },
      },
    },
  };
</script>
</head>
<body class="bg-surface-page text-ink-primary font-body min-h-screen">

  <header data-mount="header"
          class="border-b border-surface-edge bg-surface-raised">
  </header>

  <main class="grid grid-cols-[18rem_1fr] min-h-[calc(100vh-4rem)]">
    <aside data-mount="sidebar"
           class="border-r border-surface-edge bg-surface-raised overflow-y-auto">
    </aside>
    <section data-mount="content"
             class="overflow-y-auto">
    </section>
  </main>

  <div data-mount="overlay"></div>
  <div data-mount="dialog"></div>
  <div data-mount="toast"
       class="fixed bottom-5 right-5 z-50"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
